# Netlify build settings for the HomeFit frontend (Next.js app in frontend/).
# The API (including the catalog) runs on Railway; the frontend rewrites /api/catalog-map* to it using
# RAILWAY_API_BASE_URL, which must be set in the Netlify site's environment variables before the build.
[build]
  base = "frontend"
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
